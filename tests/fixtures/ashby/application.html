<!doctype html>
<html>
<body>
  <h1>Product Engineer</h1>
  <form>
    <div class="_fieldEntry">
      <label for="_systemfield_name">Name<span aria-hidden="true">*</span></label>
      <input id="_systemfield_name" name="_systemfield_name" required />
    </div>
    <div class="_fieldEntry">
      <label for="_systemfield_email">Email<span aria-hidden="true">*</span></label>
      <input id="_systemfield_email" name="_systemfield_email" type="email" required />
    </div>
    <div class="_fieldEntry">
      <label for="_systemfield_resume">Resume</label>
      <input id="_systemfield_resume" name="_systemfield_resume" type="file" />
    </div>
    <div class="_fieldEntry">
      <label for="q_notice">What is your notice period?</label>
      <input id="q_notice" name="9f8a1c2e-0000-4444-8888-abcabcabcabc" />
    </div>
    <div class="_fieldEntry">
      <span id="lbl_relocate">Are you willing to relocate?</span>
      <div role="radiogroup" aria-labelledby="lbl_relocate">
        <label><input type="radio" name="relocate" value="Yes" /> Yes</label>
        <label><input type="radio" name="relocate" value="No" /> No</label>
      </div>
    </div>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
